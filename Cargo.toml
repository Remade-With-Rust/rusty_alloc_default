[package]
name = "rusty_alloc_default"
version = "0.1.1"
authors = ["Remade With Rust / Mata Network"]
description = "Installs rusty_alloc as the process #[global_allocator] — shared default for Remade UI crates (Remade With Rust)"
repository = "https://github.com/Remade-With-Rust/rusty_alloc_default"
documentation = "https://docs.rs/rusty_alloc_default"
homepage = "https://github.com/Remade-With-Rust/rusty_alloc_default"
license = "MIT"
keywords = ["allocator", "rusty_alloc", "mimalloc", "wasm", "no-std"]
categories = ["memory-management", "no-std"]
readme = "README.md"
edition = "2021"
rust-version = "1.73"
# This crate declares the `#[global_allocator]`, and a program may define exactly
# one. Cargo permits at most one package per `links` value in a dependency graph,
# so claiming a value here turns "two allocators reached the same build" into a
# RESOLVE-time error that names both packages -- instead of the multiple-symbol
# link error you get today, at the end of a long build, saying nothing about
# where either came from.
#
# The value is shared deliberately with the per-workspace seams (rzstd-alloc, and
# the others as they adopt it), because they are alternatives to this crate, not
# companions: a build wants one or the other, never both.
links = "rusty_alloc_global"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Guard pages + encrypted free lists (~4-7% instructions, measured upstream).
secure = ["rusty_alloc-api/secure"]

[dependencies]
# Pin exactly: rusty_alloc is 0.x and earlier releases had UAFs on all targets.
rusty_alloc-api = { version = "=1.1.4" }
